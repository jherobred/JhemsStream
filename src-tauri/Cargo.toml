[package]
name = "jhemsstream"
version = "0.2.0"
description = "Volunteer-friendly OBS control panel for livestream crews"
license = "MIT"
repository = "https://github.com/jherobred/JhemsStream"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
